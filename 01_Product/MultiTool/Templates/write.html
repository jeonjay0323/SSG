<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060B">
<title>슥 · 멀티툴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2" />
<style>
  /* ── SSG-Demo 디자인 시스템 ───────────────────────────── */
  @font-face{font-family:'Paperlogy';font-weight:400;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');font-display:swap;}
  @font-face{font-family:'Paperlogy';font-weight:500;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-display:swap;}
  @font-face{font-family:'Paperlogy';font-weight:700;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-display:swap;}

  :root{
    /* SSG-Demo 토큰의 다크 변형 — 브랜드(바이올렛·그린)는 그대로,
       표면/텍스트만 반전. 작은 글씨용 바이올렛만 가독성을 위해 밝게 둔다. */
    --surface:#121214; --surface-container:#1a1a1c; --white:#1a1a1c;
    --chacole:#f2f2f4; --on-surface:#f2f2f4; --gray900:#f2f2f4;
    --dust:#8e8e93; --neutral:#8e8e93; --gray700:#8e8e93;
    --outline-light:#2e2e33; --outline-dark:#525252;
    --primary:#a100ff; --violet:#a100ff; --violet-text:#c07bff;
    --accent:#00a43e; --black:#000;
    --brand:'Paperlogy','Pretendard',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    background:var(--surface);color:var(--chacole);
    font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;line-height:1.7;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px);
    display:flex;flex-direction:column;gap:16px;
    -webkit-user-select:none;user-select:none;
    max-width:480px;margin:0 auto;
  }

  /* ── 상단 ── */
  header{display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:var(--brand);font-weight:700;font-size:24px;color:var(--on-surface)}
  .phase{
    display:flex;align-items:center;gap:6px;font-family:var(--brand);font-size:12px;
    padding:4px 8px;border-radius:4px;border:1px solid var(--outline-light);color:var(--dust);
  }
  .phase .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);
              animation:blink 1.5s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .phase b{color:var(--violet-text);font-variant-numeric:tabular-nums;font-weight:500}

  .hrow{display:flex;align-items:center;gap:8px}
  .btn-ghost{
    padding:4px 10px;border-radius:4px;border:1px solid var(--outline-light);
    background:none;color:var(--dust);font-family:var(--brand);font-size:12px;
    transition:opacity .15s;
  }
  .btn-ghost:hover{opacity:.7}
  .btn-ghost.arm{border-color:var(--violet);color:var(--violet-text)}

  /* ── 공통 ── */
  .card{background:var(--surface-container);border:1px solid var(--outline-light);border-radius:4px;padding:16px}
  h2{font-family:var(--brand);font-weight:700;font-size:24px;color:var(--on-surface);line-height:1.35}
  .sub{font-family:var(--brand);font-weight:400;font-size:12px;color:var(--dust);line-height:1.6}
  .ctx{font-family:var(--brand);font-size:12px;color:var(--dust);margin-bottom:6px}
  .lead{
    font-family:var(--brand);font-weight:500;font-size:16px;color:var(--violet-text);
    line-height:1.5;margin-bottom:12px;padding-bottom:12px;
    border-bottom:1px solid var(--outline-light);
  }

  input#nickInput{
    width:100%;border:none;outline:none;background:none;
    color:var(--chacole);font-family:'Pretendard';font-weight:600;
    font-size:22px;line-height:1.6;padding:6px 0;
    -webkit-user-select:text;user-select:text;caret-color:var(--violet);
  }
  input#nickInput::placeholder{color:var(--dust);font-weight:400}
  .btn-plain{
    width:100%;margin-top:10px;padding:12px;border-radius:4px;background:none;
    border:1px solid var(--outline-light);color:var(--dust);
    font-family:var(--brand);font-size:14px;transition:opacity .15s;
  }
  .btn-plain:hover{opacity:.7}

  textarea{
    width:100%;min-height:104px;resize:none;border:none;outline:none;background:none;
    color:var(--chacole);font-family:'Pretendard';font-weight:400;font-size:16px;line-height:1.7;
    -webkit-user-select:text;user-select:text;caret-color:var(--violet);
  }
  textarea::placeholder{color:var(--dust)}
  .count{text-align:right;font-family:var(--brand);font-size:12px;color:var(--dust);
         font-variant-numeric:tabular-nums;margin-top:6px}
  .count.over{color:#d33}

  /* ── 버튼 (SSG-Demo .btn) ── */
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px 12px;border-radius:4px;
    font-family:var(--brand);font-weight:500;font-size:14px;line-height:normal;
    background:var(--violet);color:#fff;border:1px solid var(--violet);
    transition:opacity .15s;
  }
  .btn:hover{opacity:.7}
  .btn[disabled]{background:var(--outline-light);border-color:var(--outline-light);
                 color:var(--dust);cursor:default;opacity:1}

  /* ── 시나리오 선택 ── */
  .scen{
    border:1px solid var(--outline-light);border-radius:4px;overflow:hidden;
    background:var(--surface-container);margin-bottom:16px;transition:opacity .15s;
  }
  .scen:hover{opacity:.85}
  .scen.sel{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
  .scen .ph{width:100%;aspect-ratio:16/9;background:var(--black);display:block;object-fit:cover}
  .scen .b{padding:14px 15px 16px}
  .scen .t{font-family:var(--brand);font-weight:700;font-size:18px;color:var(--on-surface)}
  .scen .l{margin-top:6px;font-size:13px;line-height:1.6;color:var(--dust)}
  .scen .st{margin-top:8px;font-family:var(--brand);font-size:11px;color:var(--dust)}
  .scen .lead{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--outline-light);
    margin-bottom:0;font-size:14px;
  }

  /* ── 투표 ── */
  .cand{
    border:1px solid var(--outline-light);border-radius:4px;overflow:hidden;
    background:var(--surface-container);margin-bottom:16px;transition:opacity .15s;
  }
  .cand:hover{opacity:.85}
  .cand.picked{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
  .cand .media{width:100%;aspect-ratio:16/9;background:var(--black);position:relative}
  .cand .media video,.cand .media img{width:100%;height:100%;object-fit:cover;display:block}
  .cand .b{padding:12px 13px}
  .cand .t b{color:var(--violet-text)}
  .cand .t{font-size:14px;line-height:1.6;color:var(--chacole)}
  .cand .bar{margin-top:10px;height:4px;border-radius:4px;background:var(--outline-light);overflow:hidden}
  .cand .bar i{display:block;height:100%;background:var(--violet);width:0;transition:width .5s ease}
  .cand .v{margin-top:6px;font-family:var(--brand);font-size:12px;color:var(--dust);
           display:flex;justify-content:space-between}

  /* ── 상태 메시지 ── */
  .note{text-align:center;padding:40px 16px;color:var(--dust);font-size:14px;line-height:1.7}
  .note .em{display:block;font-family:var(--brand);font-weight:700;font-size:20px;
            color:var(--on-surface);margin-bottom:8px}
  .spinner{
    width:26px;height:26px;margin:0 auto 16px;border:2px solid var(--outline-light);
    border-top-color:var(--violet);border-radius:50%;animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  #toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(14px);
    background:var(--surface-container);color:var(--on-surface);
    border:1px solid var(--outline-light);font-family:var(--brand);
    padding:10px 16px;border-radius:4px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .28s;z-index:9;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .hide{display:none !important}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="btn-ghost hide" id="homeBtn" aria-label="이야기 고르기로 돌아가기">← 홈</button>
    <div class="logo">슥</div>
  </div>
  <div class="hrow">
    <button class="btn-ghost hide" id="nickBtn"></button>
    <div class="phase"><span class="dot"></span><span id="phaseText">연결 중</span></div>
  </div>
</header>

<!-- 시나리오 선택 -->
<section id="vChoose" class="hide">
  <h2 id="inviteText" style="margin-bottom:4px">문장을 고르고, 이야기를 이어 만들어볼까요?</h2>
  <div class="sub" style="margin-bottom:16px">하나를 고르면 그 이야기가 시작됩니다.</div>
  <div id="scenarios"></div>
</section>

<!-- 닉네임 -->
<section id="vNick" class="hide">
  <div class="card">
    <div class="ctx" id="nickCtx"></div>
    <h2 style="margin-bottom:6px">어떻게 불러드릴까요?</h2>
    <div class="sub" style="margin-bottom:14px">
      큰 화면에 문장과 함께 표시됩니다.
    </div>
    <input id="nickInput" type="text" maxlength="12" placeholder="닉네임"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="count" id="nickCount">0 / 12</div>
  </div>
  <div style="height:14px"></div>
  <button class="btn" id="nickSave" disabled>이 이름으로 시작</button>
  <button class="btn-plain" id="nickSkip">이름 없이 시작</button>
</section>

<!-- 접수 -->
<section id="vSubmit" class="hide">
  <div class="card">
    <div class="ctx" id="ctxLabel"></div>
    <div class="lead" id="lead"></div>
    <textarea id="text" placeholder="다음 이야기를 한 문장으로" maxlength="60"
              autocomplete="off" autocorrect="off"></textarea>
    <div class="count" id="count">0 / 40</div>
  </div>
  <div style="height:14px"></div>
  <button class="btn" id="send" disabled>이 문장 보내기</button>
  <div class="sub" style="text-align:center;margin-top:12px" id="poolNote"></div>
</section>

<!-- 접수 완료 대기 -->
<section id="vWaiting" class="hide">
  <div class="note">
    <span class="em">보냈습니다</span>
    큰 화면 아래쪽에<br>방금 보낸 문장이 떠 있습니다.
    <div style="margin-top:18px;font-size:13px" id="waitCount"></div>
  </div>
</section>

<!-- 생성 -->
<section id="vGenerate" class="hide">
  <div class="note">
    <div class="spinner"></div>
    <span class="em">장면을 만드는 중</span>
    큰 화면에 첫 프레임이 먼저 나옵니다.
    <div style="margin-top:16px;font-size:13px" id="genLeft"></div>
  </div>
</section>

<!-- 투표 -->
<section id="vVote" class="hide">
  <h2 style="margin-bottom:4px">어느 장면으로 이어갈까요</h2>
  <div class="sub" style="margin-bottom:14px">하나를 골라주세요. 바꿔도 됩니다.</div>
  <div id="cands"></div>
</section>

<!-- 발표 -->
<section id="vReveal" class="hide">
  <div class="note">
    <span class="em">이 장면으로 이어집니다</span>
    <div id="winnerText" style="font-size:17px;color:var(--text);margin:14px 0 6px"></div>
    <div id="winnerVotes" style="font-size:13px"></div>
    <div style="margin-top:20px;font-size:13px">곧 다음 라운드가 시작됩니다</div>
  </div>
</section>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════════
   폰 입력 페이지

   라운드 단계를 따라 화면이 바뀐다:
     접수 → (내가 냈으면) 대기 → 생성 → 투표 → 발표
   ════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const POLL = 1000;

/* 참여자 식별 — 중복 제출·중복 투표를 막는 용도.
   완벽한 방어는 아니지만 전시장에서는 충분하다. */
const voter = (() => {
  let v = localStorage.getItem('sk_voter');
  if(!v){ v = 'v_' + Math.random().toString(36).slice(2,11); localStorage.setItem('sk_voter', v); }
  return v;
})();

let story = null, storyAt = 0;
let maxChars = 40;
let submittedRound = -1;   // 내가 문장을 낸 라운드
let sending = false;       // 전송 중 — 폴링이 화면을 되돌리지 못하게
let genStartedAt = 0;      // 생성 시작 시각 (남은 시간 추정용)
let myVote = null;
let lastPhase = null, lastRound = -1;

function show(id){
  ['vChoose','vNick','vSubmit','vWaiting','vGenerate','vVote','vReveal']
    .forEach(v => $('#'+v).classList.toggle('hide', v !== id));
}

/* ── 닉네임 ──
   이야기를 고른 뒤 한 번만 묻는다. 큰 화면에 문장과 함께 뜨기 때문에
   "내 문장이 저기 있다"를 알아보게 하는 장치다. 건너뛸 수 있다. */
/* 이름은 기억하되(다음에 자동으로 채워준다), "물어봤다"는 사실은 기억하지 않는다.
   전시에서는 이야기를 새로 고를 때마다 새 사람일 수 있다 — 매번 물어야 한다.
   다만 화면이 잠겼다 돌아온 경우까지 다시 묻지는 않으려고
   sessionStorage 를 쓴다(탭이 살아 있는 동안만 유지). */
let nick = localStorage.getItem('sk_nick') || '';
let nickAsked = sessionStorage.getItem('sk_nick_asked') === '1';

const nickIn = $('#nickInput');
nickIn.addEventListener('input', () => {
  const v = nickIn.value.trim();
  $('#nickCount').textContent = `${v.length} / 12`;
  $('#nickSave').disabled = v.length === 0;
  $('#nickSave').textContent = v ? `${withRo(v)} 시작` : '이 이름으로 시작';
});
$('#nickSave').addEventListener('click', () => setNick(nickIn.value.trim()));
$('#nickSkip').addEventListener('click', () => setNick(''));
/* 받침에 따라 '로/으로' — "제이 으로" 같은 문장이 나오지 않게 */
function withRo(name){
  const c = name.charCodeAt(name.length - 1);
  if(c >= 0xac00 && c <= 0xd7a3){
    const jong = (c - 0xac00) % 28;
    return name + (jong === 0 || jong === 8 ? '로' : '으로');
  }
  return name + '(으)로';
}

function setNick(v){
  nick = v;
  nickAsked = true;
  localStorage.setItem('sk_nick', v);
  sessionStorage.setItem('sk_nick_asked', '1');
  paintNickBtn();
}
function paintNickBtn(){
  const b = $('#nickBtn');
  b.textContent = nick || '이름 없음';
  b.classList.toggle('hide', !myTrack);
}
$('#nickBtn').addEventListener('click', () => {
  nickAsked = false;
  sessionStorage.removeItem('sk_nick_asked');
});

/* 홈 — 이야기를 지우지 않고 선택 화면으로 돌아간다 */
$('#homeBtn').addEventListener('click', () => {
  myTrack = null;
  localStorage.removeItem('sk_track');
  submittedRound = -1; myVote = null; scenariosDrawn = false;
});

/* 시나리오 선택 — 아직 이야기가 시작되지 않았을 때만 */
let scenariosDrawn = false;
function renderScenarios(st){
  if(!story?.scenarios) return;
  $('#inviteText').textContent = story.invite || '이야기를 골라주세요';
  const state = {};
  (st?.tracks || []).forEach(t => state[t.id] = t);
  const sig = (st?.tracks || []).map(t => `${t.id}${t.phase}${t.canon.length}`).join('|');
  if($('#scenarios').dataset.sig === sig && scenariosDrawn) return;
  $('#scenarios').dataset.sig = sig; scenariosDrawn = true;

  $('#scenarios').innerHTML = story.scenarios.map(sc => {
    const t = state[sc.id] || {};
    const n = (t.canon || []).length;
    const ph = {idle:'참여 기다리는 중', collect:'지금 접수 중',
                generate:'장면 만드는 중', vote:'투표 중',
                reveal:'방금 이어졌습니다'}[t.phase] || '';
    return `
    <div class="scen" data-id="${sc.id}">
      <img class="ph" src="${sc.poster}" alt="">
      <div class="b">
        <div class="t">${esc(sc.title)}</div>
        <div class="l">${esc(sc.logline)}</div>
        <div class="lead">${esc(n ? (t.canon[n-1].text) : sc.lead)} …</div>
        <div class="st">${n}번째 장면까지 · ${ph}</div>
      </div>
    </div>`;
  }).join('');
  $('#scenarios').querySelectorAll('.scen').forEach(el => {
    el.onclick = () => { joinTrack(el.dataset.id); scenariosDrawn = false; };
  });
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2200);
}
async function post(path, body){
  const r = await fetch(path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({...body, voter}),
  });
  return r.json();
}

/* ── 입력 ── */
const ta = $('#text');
ta.addEventListener('input', () => {
  const n = ta.value.trim().length;
  const over = n > maxChars;
  $('#count').textContent = `${n} / ${maxChars}`;
  $('#count').classList.toggle('over', over);
  $('#send').disabled = n === 0 || over;
});

$('#send').addEventListener('click', async () => {
  if(sending) return;
  sending = true;
  $('#send').disabled = true;
  try{
    const res = await post('/api/submit',
      {scenarioId: myTrack, text: ta.value.trim(), nick});
    if(res.ok){
      // 라운드 번호는 서버 응답에서 받는다.
      // lastRound 를 쓰면 폴링이 아직 안 돈 시점에 -1 이 들어가 입력 화면으로 되돌아간다.
      submittedRound = res.round ?? lastRound;
      lastRound = submittedRound;
      ta.value = ''; $('#count').textContent = `0 / ${maxChars}`;
      show('vWaiting');
    } else {
      toast(res.message || '보내지 못했습니다');
      $('#send').disabled = false;
    }
  } catch(e){
    toast('보내지 못했습니다');
    $('#send').disabled = false;
  } finally {
    sending = false;
  }
});

/* ── 처음으로 ──
   전시에서 실수로 이야기가 날아가면 곤란하므로 두 번 눌러야 실행된다. */


/* ── 투표 ── */
function renderCands(st){
  const total = Math.max(st.totalVotes, 1);
  $('#cands').innerHTML = st.candidates.map(c => `
    <div class="cand ${myVote===c.id?'picked':''}" data-id="${c.id}">
      <div class="media">
        ${c.video ? `<video src="${c.video}" muted playsinline loop autoplay></video>`
          : c.still ? `<img src="${c.still}" alt="">` : ''}
      </div>
      <div class="b">
        <div class="t">${c.nick ? `<b>${esc(c.nick)}</b> ` : ''}${esc(c.text)}</div>
        <div class="bar"><i style="width:${(c.votes/total*100).toFixed(0)}%"></i></div>
        <div class="v"><span>${myVote===c.id?'내 선택':''}</span><span>${c.votes}표</span></div>
      </div>
    </div>`).join('');

  $('#cands').querySelectorAll('.cand').forEach(el => {
    el.onclick = async () => {
      const res = await post('/api/vote', {scenarioId: myTrack, candidateId: el.dataset.id});
      if(res.ok){ myVote = el.dataset.id; toast(res.message); }
      else toast(res.message);
    };
  });
}
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── 폴링 ── */
let myTrack = localStorage.getItem('sk_track') || null;

function joinTrack(sid){
  myTrack = sid;
  localStorage.setItem('sk_track', sid);
  submittedRound = -1; myVote = null;
  // 새 이야기에 들어갈 때마다 이름을 다시 묻는다 (앞사람 이름을 물려받지 않게)
  nickAsked = false;
  sessionStorage.removeItem('sk_nick_asked');
}

async function tick(){
  try{
    // story 를 한 번만 읽으면 배포 후에도 옛 시나리오가 계속 보인다
    if(!story || performance.now() - storyAt > 15000){
      const fresh = await fetch('/api/story').then(r=>r.json()).catch(()=>null);
      if(fresh){
        const changed = JSON.stringify((fresh.scenarios||[]).map(x=>x.id))
                     !== JSON.stringify((story?.scenarios||[]).map(x=>x.id));
        story = fresh; storyAt = performance.now();
        maxChars = story.handoff?.maxChars || 40;
        if(changed){ scenariosDrawn = false; myTrack = null; }
      }
    }
    if(!story){ setTimeout(tick, POLL); return; }

    const st = await fetch('/api/round').then(r=>r.json());
    if(sending){ setTimeout(tick, POLL); return; }

    const t = st.tracks.find(x => x.id === myTrack);

    // 아직 어느 이야기에도 안 들어갔으면 선택 화면
    if(!t){
      renderScenarios(st);
      show('vChoose');
      $('#homeBtn').classList.add('hide');
      $('#nickBtn').classList.add('hide');
      $('#phaseText').textContent = '이야기 고르기';
      setTimeout(tick, POLL);
      return;
    }
    $('#homeBtn').classList.remove('hide');
    paintNickBtn();

    // 이야기를 고른 직후 한 번, 이름을 묻는다
    if(!nickAsked){
      const scn = (story.scenarios || []).find(x => x.id === t.id) || {};
      $('#nickCtx').textContent = scn.title ? `〈${scn.title}〉에 참여합니다` : '';
      if(!$('#vNick').classList.contains('shown')){
        $('#vNick').classList.add('shown');
        nickIn.value = nick;                       // 지난 이름을 미리 채워둔다
        $('#nickCount').textContent = `${nick.length} / 12`;
        $('#nickSave').disabled = nick.length === 0;
        $('#nickSave').textContent = nick ? `${withRo(nick)} 시작` : '이 이름으로 시작';
      }
      show('vNick');
      $('#phaseText').textContent = '이름 정하기';
      setTimeout(tick, POLL);
      return;
    }
    $('#vNick').classList.remove('shown');

    const sc = (story.scenarios || []).find(x => x.id === t.id) || {};
    const last = t.canon?.length ? t.canon[t.canon.length - 1] : null;
    $('#ctxLabel').textContent = last ? `${sc.title} · 씬 ${last.n}까지` : (sc.title || '');
    $('#lead').textContent = last ? last.text : (sc.lead || '');

    if(t.round !== lastRound){
      lastRound = t.round; myVote = null;
      if(submittedRound !== t.round) submittedRound = -1;
    }

    const label = {idle:'대기', collect:'접수', generate:'생성',
                   vote:'투표', reveal:'발표', finale:'완결'}[t.phase] || t.phase;
    const clock = (t.remaining === null || t.phase === 'generate') ? '' : t.remaining + 's';
    $('#phaseText').innerHTML = `${label} <b>${clock}</b>`;

    if(t.phase !== 'generate') genStartedAt = 0;

    if(t.phase === 'idle' || t.phase === 'collect'){
      if(submittedRound === t.round){
        show('vWaiting');
        $('#waitCount').textContent = t.poolCount > 1
          ? `${t.poolCount}명이 참여했습니다 · 곧 투표가 열립니다`
          : '다른 분이 참여하면 투표가 열립니다';
      } else {
        show('vSubmit');
        $('#poolNote').textContent = t.phase === 'idle'
          ? '첫 번째로 보내보세요'
          : `${t.poolCount}명이 이미 보냈습니다 · ${t.remaining}초 남음`;
        $('#send').disabled = ta.value.trim().length === 0;
      }
    } else if(t.phase === 'generate'){
      show('vGenerate');
      if(genStartedAt === 0) genStartedAt = performance.now();
      const left = Math.max(0, Math.round(55 - (performance.now() - genStartedAt) / 1000));
      $('#genLeft').textContent = left ? `약 ${left}초 남음` : '거의 다 됐습니다';
    } else if(t.phase === 'vote'){
      show('vVote'); renderCands(t);
    } else if(t.phase === 'finale'){
      show('vReveal');
      $('#winnerText').textContent = '이야기가 완결됐습니다';
      $('#winnerVotes').textContent = `${t.canon.length}개의 장면이 이어졌습니다`;
    } else if(t.phase === 'reveal'){
      show('vReveal');
      const w = t.candidates.find(c => c.id === t.winner);
      $('#winnerText').textContent = w ? w.text : '';
      $('#winnerVotes').textContent = !w ? ''
        : t.contested ? `${w.votes}표로 선택됐습니다` : '단독 참여로 바로 이어집니다';
    }
  }catch(e){
    $('#phaseText').textContent = '연결 끊김';
  }
  setTimeout(tick, POLL);
}
tick();
</script>
</body>
</html>
