<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>슥 · 한 줄 극장 — 상영</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2" />
<style>
  /* ── SSG 디자인 시스템 · 다크 ─────────────────────────── */
  @font-face{font-family:'Paperlogy';font-weight:400;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');font-display:swap;}
  @font-face{font-family:'Paperlogy';font-weight:500;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-display:swap;}
  @font-face{font-family:'Paperlogy';font-weight:700;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-display:swap;}

  :root{
    --surface:#121214; --surface-container:#1a1a1c;
    --chacole:#f2f2f4; --on-surface:#f2f2f4;
    --dust:#8e8e93; --outline-light:#2e2e33;
    --violet:#a100ff; --violet-text:#c07bff; --accent:#00a43e; --black:#000;
    --brand:'Paperlogy','Pretendard',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--surface);color:var(--chacole);
    font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;line-height:1.6;
    display:flex;flex-direction:column;
  }

  /* ── 상단 ── */
  header{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--outline-light);
  }
  header .logo{font-family:var(--brand);font-weight:700;font-size:22px}
  header .inv{font-family:var(--brand);font-size:14px;color:var(--dust)}
  header .url{
    font-family:ui-monospace,monospace;font-size:13px;color:var(--violet-text);
    border:1px solid var(--outline-light);border-radius:4px;padding:5px 12px;
  }

  /* ── 3분할 ── */
  #grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
        background:var(--outline-light)}
  .col{background:var(--black);position:relative;display:flex;flex-direction:column;
       overflow:hidden}

  /* 세로 영상 무대 */
  .stagebox{flex:1;min-height:0;position:relative;background:var(--black)}
  .stagebox video,.stagebox img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    opacity:0;transition:opacity .45s ease;
  }
  .stagebox video.on,.stagebox img.on{opacity:1}

  /* 트랙 머리말 */
  .head{
    position:absolute;top:0;left:0;right:0;z-index:3;padding:14px 16px 26px;
    background:linear-gradient(to bottom,rgba(0,0,0,.78),transparent);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .head .t{font-family:var(--brand);font-weight:700;font-size:17px;color:#fff}
  .col.fin{outline:2px solid var(--violet);outline-offset:-2px}
  .fin-badge{
    position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:6;
    font-family:var(--brand);font-weight:700;font-size:13px;color:#fff;
    background:var(--violet);border-radius:4px;padding:4px 12px;display:none;
  }
  .fin-badge.on{display:block}
  .head .ph{
    font-family:var(--brand);font-size:11px;color:var(--violet-text);
    background:rgba(18,18,20,.8);border-radius:4px;padding:3px 8px;white-space:nowrap;
  }

  /* 자막 */
  .cap{
    position:absolute;left:0;right:0;bottom:0;z-index:3;padding:70px 16px 16px;
    background:linear-gradient(to top,rgba(0,0,0,.9) 40%,transparent);
    font-family:var(--brand);font-weight:700;font-size:19px;line-height:1.45;
    text-align:center;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.9);
  }

  .cap .by{
    display:block;font-size:12px;font-weight:700;color:var(--violet-text);
    margin-bottom:5px;letter-spacing:.04em;
  }

  /* 접수 중 — 들어온 문장이 쌓인다 */
  .inbox{
    position:absolute;left:0;right:0;bottom:0;z-index:4;padding:60px 14px 14px;
    background:linear-gradient(to top,rgba(10,10,12,.94) 55%,transparent);
    display:none;flex-direction:column;gap:6px;
  }
  .inbox.on{display:flex}
  .inbox .ttl{font-family:var(--brand);font-size:12px;color:var(--violet-text)}
  .inbox .m{
    padding:7px 11px;border-radius:4px;background:rgba(26,26,28,.95);
    border:1px solid var(--outline-light);font-size:14px;line-height:1.45;
    animation:slideIn .35s ease both;
  }
  .inbox .m.fresh{border-color:var(--violet);color:#fff}
  .inbox .m .who{
    display:inline-block;margin-right:7px;font-family:var(--brand);font-weight:700;
    font-size:11px;color:var(--violet-text);
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 생성 중 — 후보 첫 프레임 */
  .gen{position:absolute;inset:0;z-index:5;display:none;background:var(--black)}
  .gen.on{display:flex;flex-direction:column}
  .gen .cands{flex:1;min-height:0;display:flex;gap:2px}
  .gen .c{flex:1 1 0;min-width:0;position:relative;background:#0c0c0e}
  .gen .c img{width:100%;height:100%;object-fit:cover;
              animation:kenburns 12s ease-out both}
  .gen .c .w{position:absolute;inset:0;display:flex;align-items:center;
             justify-content:center;color:var(--dust);font-family:var(--brand);font-size:11px}
  .gen .c .tx b,.vote .c .tx b{color:var(--violet-text);font-weight:700}
  .gen .c .tx{position:absolute;left:0;right:0;bottom:0;padding:26px 8px 8px;
              background:linear-gradient(to top,rgba(0,0,0,.92),transparent);
              font-size:12px;line-height:1.4;color:#fff}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
  .gen .lab{flex:none;padding:10px;text-align:center;font-family:var(--brand);
            font-size:12px;color:var(--dust);background:var(--surface)}

  /* 투표 중 */
  .vote{position:absolute;inset:0;z-index:6;display:none;background:var(--black)}
  .vote.on{display:flex;flex-direction:column}
  .vote .cands{flex:1;min-height:0;display:flex;gap:2px}
  .vote .c{flex:1 1 0;min-width:0;position:relative;background:#0c0c0e;
           border-top:3px solid transparent}
  .vote .c.lead{border-top-color:var(--violet)}
  .vote .c video,.vote .c img{width:100%;height:100%;object-fit:cover}
  .vote .c .tx{position:absolute;left:0;right:0;bottom:0;padding:30px 8px 8px;
               background:linear-gradient(to top,rgba(0,0,0,.94),transparent);
               font-size:12px;line-height:1.4;color:#fff}
  .vote .c .n{position:absolute;top:6px;right:8px;font-family:var(--brand);
              font-weight:700;font-size:18px;color:var(--violet-text)}
  .vote .lab{flex:none;padding:10px;text-align:center;font-family:var(--brand);
             font-weight:700;font-size:14px;color:var(--on-surface);background:var(--surface)}

  /* 대기 */
  .idle{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;
        align-items:center;justify-content:center;gap:10px;padding:20px;
        background:rgba(0,0,0,.55)}
  .idle.on{display:flex}
  .idle .h{font-family:var(--brand);font-weight:700;font-size:17px;text-align:center}
  .idle .s{font-family:var(--brand);font-size:12px;color:var(--dust);text-align:center}

  /* ── 하단 ── */
  footer{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:10px 24px;border-top:1px solid var(--outline-light);
    font-family:var(--brand);font-size:12px;color:var(--dust);
  }
  footer b{color:var(--violet-text);font-size:16px;font-weight:700;margin-right:4px}
  .btn-ghost{
    padding:4px 10px;border-radius:4px;border:1px solid var(--outline-light);
    background:none;color:var(--dust);font-family:var(--brand);font-size:12px;
    cursor:pointer;transition:opacity .15s;
  }
  .btn-ghost:hover{opacity:.7}
  .btn-ghost.arm{border-color:var(--violet);color:var(--violet-text)}
</style>
</head>
<body>

<header>
  <div class="logo">슥</div>
  <div class="inv" id="invite"></div>
  <div class="url" id="url"></div>
</header>

<div id="grid"></div>

<footer>
  <div><b id="total">0</b>개의 장면이 만들어졌습니다</div>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="spend"></span>
    <button class="btn-ghost" id="backBtn">전부 처음으로</button>
  </div>
</footer>

<script>
/* ════════════════════════════════════════════
   상영 화면 — 3분할

   세 이야기가 각각 독립적으로 돌아간다. 한 칸이 한 이야기다.
   영상은 9:16 세로라 세 칸을 나란히 놓으면 16:9 화면을 거의 채운다.

   칸마다 상태에 따라 겹쳐진 층이 켜진다:
     재생(기본) · 접수 오버레이 · 생성(후보 첫 프레임) · 투표
   ════════════════════════════════════════════ */

const POLL = 900;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let story = null, storyAt = 0;
const cols = {};        // sid -> { el, played:Set, idx, until, front }

function buildGrid(tracks){
  $('#grid').innerHTML = tracks.map(t => `
    <div class="col" data-sid="${t.id}">
      <div class="stagebox">
        <video class="la" muted playsinline></video>
        <video class="lb" muted playsinline></video>
        <img class="im" alt="">
        <div class="head"><div class="t">${esc(t.title)}</div>
          <div class="ph"></div></div>
        <div class="cap"></div>
        <div class="fin-badge">이야기 완결 · 곧 새 이야기가 시작됩니다</div>
        <div class="idle">
          <div class="h">${esc(t.lead || '')}</div>
          <div class="s">폰에서 이 이야기를 골라<br>다음 문장을 보내주세요</div>
        </div>
        <div class="inbox"><div class="ttl"></div><div class="list"></div></div>
        <div class="gen"><div class="cands"></div>
          <div class="lab">첫 프레임이 나왔습니다 — 곧 움직입니다</div></div>
        <div class="vote"><div class="cands"></div>
          <div class="lab">어느 장면으로 이어갈까요</div></div>
      </div>
    </div>`).join('');
  tracks.forEach(t => {
    const el = $(`.col[data-sid="${t.id}"]`);
    cols[t.id] = { el, played:new Set(), idx:-1, until:0, front:'a' };
  });
}

/* 도입부 + canon 을 한 줄로 */
function scenesOf(t){
  const sc = (story?.scenarios || []).find(x => x.id === t.id);
  const intro = ((sc?.scenes) || []).map(s => ({
    key:'f'+s.n, caption:s.caption, image:s.image, video:s.video,
    hold:(s.holdSeconds||8)*1000,
  }));
  return intro.concat((t.canon||[]).map(c => ({
    key:'c'+c.n, caption:c.text, nick:c.nick || '',
    image:c.still, video:c.video, hold:6000,
  })));
}

function play(sid, scene){
  const c = cols[sid], box = c.el.querySelector('.stagebox');
  const im = box.querySelector('.im');
  const cap = box.querySelector('.cap');
  cap.innerHTML = (scene.nick ? `<span class="by">${esc(scene.nick)}</span>` : '')
                + esc(scene.caption || '');
  if(scene.video){
    const next = box.querySelector(c.front === 'a' ? '.lb' : '.la');
    const cur  = box.querySelector(c.front === 'a' ? '.la' : '.lb');
    im.classList.remove('on');
    next.src = scene.video; next.load();
    let done = false;
    const swap = () => {
      if(done) return; done = true;
      next.classList.add('on'); cur.classList.remove('on');
      c.front = c.front === 'a' ? 'b' : 'a';
      next.play().catch(()=>{});
      setTimeout(() => { try{ cur.pause(); }catch(e){} }, 600);
    };
    next.addEventListener('loadeddata', swap, {once:true});
    setTimeout(swap, 1500);
  } else if(scene.image){
    box.querySelectorAll('video').forEach(v => v.classList.remove('on'));
    im.src = scene.image; im.classList.add('on');
  }
  c.until = performance.now() + scene.hold;
}

function renderTrack(t){
  const c = cols[t.id];
  if(!c) return;
  const box = c.el.querySelector('.stagebox');
  const ph = {idle:'대기', collect:'접수', generate:'생성', vote:'투표',
              reveal:'발표', finale:'완결'}[t.phase] || t.phase;
  const clock = (t.remaining === null || t.phase === 'generate') ? '' : ` ${t.remaining}s`;
  box.querySelector('.head .ph').textContent = `${t.round}R · ${ph}${clock}`;

  const fin = t.phase === 'finale';
  c.el.classList.toggle('fin', fin);
  box.querySelector('.fin-badge').classList.toggle('on', fin);

  const genOn  = t.phase === 'generate';
  const voteOn = t.phase === 'vote';
  box.querySelector('.gen').classList.toggle('on', genOn);
  box.querySelector('.vote').classList.toggle('on', voteOn);

  if(genOn){
    const el = box.querySelector('.gen .cands');
    const sig = t.candidates.map(x => x.still || '').join('|');
    if(el.dataset.sig !== sig){
      el.dataset.sig = sig;
      el.innerHTML = t.candidates.map(x => `
        <div class="c">${x.still ? `<img src="${x.still}">`
                                 : '<div class="w">첫 프레임 준비 중</div>'}
          <div class="tx">${x.nick ? `<b>${esc(x.nick)}</b> ` : ''}${esc(x.text)}</div></div>`).join('');
    }
  }
  if(voteOn){
    const el = box.querySelector('.vote .cands');
    const max = Math.max(1, ...t.candidates.map(x => x.votes));
    el.innerHTML = t.candidates.map(x => `
      <div class="c ${x.votes===max && x.votes>0 ? 'lead':''}">
        ${x.video ? `<video src="${x.video}" muted playsinline loop autoplay></video>`
          : x.still ? `<img src="${x.still}">` : ''}
        <div class="n">${x.votes}</div>
        <div class="tx">${x.nick ? `<b>${esc(x.nick)}</b> ` : ''}${esc(x.text)}</div></div>`).join('');
  }

  // 접수 오버레이
  const inbox = box.querySelector('.inbox');
  if(t.phase === 'collect' && (t.pool||[]).length){
    inbox.classList.add('on');
    inbox.querySelector('.ttl').textContent = `${t.poolCount}명이 쓰는 중 · ${t.remaining}초`;
    const sig = t.pool.map(x => x.text).join('|');
    const list = inbox.querySelector('.list');
    if(list.dataset.sig !== sig){
      const prev = (list.dataset.sig || '').split('|');
      list.dataset.sig = sig;
      list.innerHTML = t.pool.map(x =>
        `<div class="m ${prev.includes(x.text) ? '' : 'fresh'}">` +
        (x.nick ? `<span class="who">${esc(x.nick)}</span>` : '') +
        `${esc(x.text)}</div>`).join('');
    }
  } else {
    inbox.classList.remove('on');
    inbox.querySelector('.list').dataset.sig = '';
  }

  // 재생 루프 — 생성·투표 중에는 멈춘다
  const scenes = scenesOf(t);
  const idleEl = box.querySelector('.idle');
  if(genOn || voteOn){ idleEl.classList.remove('on'); return; }
  if(!scenes.length){ idleEl.classList.add('on'); return; }
  idleEl.classList.remove('on');
  if(performance.now() > c.until){
    c.idx = (c.idx + 1) % scenes.length;
    play(t.id, scenes[c.idx]);
  }
}

/* 전부 처음으로 — 두 번 눌러야 실행 */
let armed = false, armTimer = null;
$('#backBtn').addEventListener('click', async () => {
  if(!armed){
    armed = true; $('#backBtn').textContent = '정말 전부?';
    $('#backBtn').classList.add('arm');
    clearTimeout(armTimer); armTimer = setTimeout(disarm, 4000);
    return;
  }
  disarm();
  await fetch('/api/reset', {method:'POST', headers:{'Content-Type':'application/json'},
                             body:'{"voter":"stage"}'});
  Object.values(cols).forEach(c => { c.played.clear(); c.idx = -1; c.until = 0; });
});
function disarm(){
  armed = false; $('#backBtn').textContent = '전부 처음으로';
  $('#backBtn').classList.remove('arm'); clearTimeout(armTimer);
}

async function tick(){
  try{
    if(!story || performance.now() - storyAt > 15000){
      const fresh = await fetch('/api/story').then(r=>r.json()).catch(()=>null);
      if(fresh){
        const changed = JSON.stringify((fresh.scenarios||[]).map(x=>x.id))
                     !== JSON.stringify((story?.scenarios||[]).map(x=>x.id));
        story = fresh; storyAt = performance.now();
        if(changed) $('#grid').innerHTML = '';
        $('#invite').textContent = story.invite || '';
      }
    }
    const st = await fetch('/api/round').then(r=>r.json());
    if(!$('#grid').children.length) buildGrid(st.tracks);
    st.tracks.forEach(renderTrack);

    $('#url').textContent = location.origin + '/write';
    $('#total').textContent = st.tracks.reduce((a,t) => a + t.canon.length, 0);
    $('#spend').textContent = st.live
      ? `생성 ${st.generated}건 · 약 $${st.spentUsd}` : '드라이런';
  }catch(e){ /* 잠깐 끊겨도 화면은 유지 */ }
  setTimeout(tick, POLL);
}
tick();
</script>
</body>
</html>
